<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="codex-in-air-scheme" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Схема контура: разработчик вызывает Grok Bot и IntelliJ IDEA вместе с плагином Air in IDEs; связь Grok Bot с MCP Server внутри IDE проверяется; из Air in IDEs через ACP-обёртку агенты Codex CLI, Qwen Code и другие расходятся: Qwen Code идёт напрямую в QwenCloud Token Plan; Codex CLI и другие идут в шлюз agentgateway, ключи провайдеров хранятся в OpenBao, у разработчика только ключ шлюза; за шлюзом OpenCode Go, QwenCloud Pay-as-you-go, NVIDIA NIM, OpenRouter и другие провайдеры, в том числе OrcaRouter, TokenRouter и DeepSeek API; Codex CLI отдельно вызывает удалённый Figma MCP server, пока вне журнала; шлюз пишет журнал Langfuse по OpenTelemetry" preserveAspectRatio="xMidYMid meet">
<title>Схема контура: разработчик вызывает Grok Bot и IntelliJ IDEA вместе с плагином Air in IDEs; связь Grok Bot с MCP Server внутри IDE проверяется; из Air in IDEs через ACP-обёртку агенты Codex CLI, Qwen Code и другие расходятся: Qwen Code идёт напрямую в QwenCloud Token Plan; Codex CLI и другие идут в шлюз agentgateway, ключи провайдеров хранятся в OpenBao, у разработчика только ключ шлюза; за шлюзом OpenCode Go, QwenCloud Pay-as-you-go, NVIDIA NIM, OpenRouter и другие провайдеры, в том числе OrcaRouter, TokenRouter и DeepSeek API; Codex CLI отдельно вызывает удалённый Figma MCP server, пока вне журнала; шлюз пишет журнал Langfuse по OpenTelemetry</title>
<style>

#codex-in-air-scheme { font-family: "IBM Plex Sans", system-ui, sans-serif; }
#codex-in-air-scheme .container-fill { fill: #F3F4F6; }
#codex-in-air-scheme .container-stroke { fill: none; stroke: #1F2328; stroke-width: 1.5; }
#codex-in-air-scheme .node-fill { fill: #FAF9F6; }
#codex-in-air-scheme .node-stroke { fill: none; stroke: #1F2328; stroke-width: 1.25; }
#codex-in-air-scheme .node-stroke.dashed { stroke-dasharray: 4 3; }
#codex-in-air-scheme .signal-stroke { fill: none; stroke: #E5482D; stroke-width: 2; }
#codex-in-air-scheme .label { fill: #1F2328; font-size: 13px; font-weight: 400; }
#codex-in-air-scheme .label-sm { fill: #1F2328; font-size: 12px; font-weight: 400; }
#codex-in-air-scheme .title { fill: #1F2328; font-size: 12px; font-weight: 600; }
#codex-in-air-scheme .muted { fill: #59636E; font-size: 11px; font-weight: 400; }
#codex-in-air-scheme .edge { fill: none; stroke: #1F2328; stroke-width: 1.25; }
#codex-in-air-scheme .edge.dotted { stroke-dasharray: 3 3; }
#codex-in-air-scheme .marker { fill: #1F2328; }
@media (prefers-color-scheme: dark) {
  #codex-in-air-scheme .container-fill { fill: #111418; }
  #codex-in-air-scheme .container-stroke { stroke: #e6e8eb; }
  #codex-in-air-scheme .node-fill { fill: #1c2128; }
  #codex-in-air-scheme .node-stroke { stroke: #e6e8eb; }
  #codex-in-air-scheme .signal-stroke { stroke: #FF7A5C; }
  #codex-in-air-scheme .label,
  #codex-in-air-scheme .label-sm,
  #codex-in-air-scheme .title { fill: #e6e8eb; }
  #codex-in-air-scheme .muted { fill: #9aa4af; }
  #codex-in-air-scheme .edge { stroke: #e6e8eb; }
  #codex-in-air-scheme .marker { fill: #e6e8eb; }
}

</style>
